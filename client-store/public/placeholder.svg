<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="50%" stop-color="#0F1424"/>
      <stop offset="100%" stop-color="#141B2D"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="160" fill="url(#glowGrad)"/>
  <!-- Subtle Frame -->
  <rect x="2" y="2" width="596" height="446" rx="16" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Gamepad Icon Center -->
  <g transform="translate(260, 150)">
    <rect x="-10" y="-10" width="100" height="80" rx="24" fill="#182035" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <path d="M 15 25 H 25 V 15 H 35 V 25 H 45 V 35 H 35 V 45 H 25 V 35 H 15 Z" fill="#94A3B8"/>
    <circle cx="55" cy="22" r="4.5" fill="#FFD166"/>
    <circle cx="65" cy="32" r="4.5" fill="#E63946"/>
  </g>
  <!-- Text Label -->
  <text x="300" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1.5">UCHIRO GAMING</text>
  <text x="300" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="0.5">IMAGE PENDING PREVIEW</text>
</svg>
