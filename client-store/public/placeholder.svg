<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stopColor="#181E34"/>
      <stop offset="60%" stopColor="#0B0F1C"/>
      <stop offset="100%" stopColor="#060810"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#6366F1"/>
      <stop offset="50%" stopColor="#8B5CF6"/>
      <stop offset="100%" stopColor="#EC4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDE68A"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle tech grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Hexagonal frame -->
  <polygon points="200,70 295,125 295,235 200,290 105,235 105,125" fill="#111628" stroke="url(#shieldGrad)" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>

  <!-- Inner Gaming Controller Symbol -->
  <g transform="translate(145, 145)" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="25" width="90" height="55" rx="20" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- D-Pad -->
    <path d="M35 43v18M26 52h18"/>
    <!-- Action buttons -->
    <circle cx="75" cy="46" r="3.5" fill="#F59E0B"/>
    <circle cx="85" cy="54" r="3.5" fill="#EC4899"/>
    <!-- Center display -->
    <line x1="50" y1="46" x2="60" y2="46"/>
  </g>

  <!-- Uchiro Text -->
  <text x="200" y="335" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#94A3B8" letter-spacing="4" text-anchor="middle">UCHIRO STORE</text>
  <text x="200" y="358" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.5" text-anchor="middle">OFFICIAL ITEM</text>
</svg>
