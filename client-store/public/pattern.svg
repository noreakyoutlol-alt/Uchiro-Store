  <circle class="glow-dot" cx="550" cy="520" r="1.8"/>
  <circle class="glow-dot" cx="50" cy="550" r="2.2"/>
  <circle class="glow-dot" cx="200" cy="670" r="1.8"/>
  <circle class="glow-dot" cx="350" cy="620" r="2"/>
  <circle class="glow-dot" cx="460" cy="670" r="1.8"/>
  <circle class="glow-dot" cx="580" cy="610" r="2"/>
  <circle class="glow-dot" cx="690" cy="660" r="1.8"/>
  <circle class="glow-dot" cx="780" cy="640" r="2"/>
  <circle class="glow-dot" cx="70" cy="760" r="2.2"/>
  <circle class="glow-dot" cx="290" cy="720" r="1.8"/>
  <circle class="glow-dot" cx="420" cy="760" r="2"/>
  <circle class="glow-dot" cx="550" cy="740" r="1.8"/>

